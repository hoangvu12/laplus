[workspace]
resolver = "2"
members = ["crates/lightcode-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The only way to hear about a change the app did not make. Default features are
# kept: everything they add is target-gated to macOS, so on the platform v1 ships
# they cost nothing, and dropping them would leave a developer running the suite
# on a Mac without a backend at all.
notify = "8"
# Ticket 17: a terminal is a pseudo-terminal or it is nothing. A program only
# emits colour, redraws a full screen, or asks for the window size when it
# believes it is talking to a tty, so a pair of pipes would not be a smaller
# version of this feature — it would be a different one that looks broken. On
# Windows this is a thin wrapper over ConPTY, which ships with the operating
# system, so what it costs the artifact is the wrapper and not an emulator.
portable-pty = "0.9"
# `bundled` compiles SQLite into the binary. The alternative is linking whatever
# the machine happens to have, which on Windows is usually nothing — and a
# desktop app that asks the user to install a database first has given up the
# thing it exists for. The cost is roughly a megabyte against a 20–30 MB target.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  # Ticket 10: the agent is a long-lived child driven over its stdio, which
  # needs an async child rather than `std::process` — the server cannot afford a
  # thread parked on a blocking read for the length of a turn.
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = "0.29"

[workspace.lints.rust]
# The server shells out, spawns children and drives a socket; none of that needs
# `unsafe`. Forbidding it here keeps that true as the workspace grows.
unsafe_code = "forbid"
