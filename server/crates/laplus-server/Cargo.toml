[package]
name = "laplus-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
atomic-write-file.workspace = true
axum.workspace = true
clap.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
notify.workspace = true
portable-pty.workspace = true
qrcode.workspace = true
reqwest.workspace = true
rustls.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

# Target-gated because a job object is a Windows idea and there is no portable
# half to depend on. `crate::process` carries the `cfg(not(windows))` no-op and
# says what that platform is still missing.
[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
rcgen = "0.13"
# A throwaway directory per test, removed on drop. The registry's tests need a
# real path on disk to add as a project and a real file to be refused, so there
# is nothing to fake here — only somewhere safe to put it.
tempfile.workspace = true
tokio-rustls.workspace = true
# The test harness's socket client. Deliberately a different implementation
# from the server's, so a passing test means two stacks agree on the framing
# rather than one stack agreeing with itself.
