# How laplus reaches somebody who is not the developer.
#
# **Two artifacts, two audiences, and they do not depend on each other.**
#
# `release` builds the Windows installer: `cargo xtask release` run on a machine
# nobody has touched, attached to a GitHub Release. Windows only, because the
# desktop shell is what installs and it ships one installer.
#
# `server` and `npm` build the plain server for five platforms and publish it to
# npm as `laplus`, so `npx laplus` starts a server and its UI on a machine with
# nothing installed but Node. That is the reference server's `npx t3@latest`,
# arrived at differently: upstream's server is Node and packs to one bundle that
# runs everywhere, ours is Rust and needs a binary per platform behind a
# launcher that picks one. `apps/cli/src/platform.ts` is the argument for that
# shape and `apps/cli/src/release.ts` is what assembles it.
#
# Upstream's `release.yml` is what this borrows its shape from, and some of it
# still does not apply: a Vercel deploy, a relay configuration and a three-hourly
# nightly cron all belong to a product with a hosted half and a team behind it.
# The nightly cron is deliberately not copied: this fork has one maintainer and a
# scheduled publish is noise with a version number on it.
#
# **Nothing here signs the artifact for Windows.** Upstream pays for Azure
# Trusted Signing; this fork does not, so SmartScreen warns about an unknown
# publisher on first run — as it already does for an installer built by hand.
# `docs/adr/0020` records that, and the separate signing key a Tauri updater
# would need, which is a different key for a different purpose.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # A dispatch builds and packs without publishing anything, so the pipeline can
  # be exercised without cutting a release nobody wanted — and, since it leaves
  # the tarballs on the run as an artifact, so the packages can be installed
  # from files on a real machine before the registry has ever heard of them.
  workflow_dispatch:
    inputs:
      build_installer:
        description: Also build the Windows installer. Slow, and not needed to try `npx laplus`.
        type: boolean
        default: false
      publish_npm:
        description: >
          Publish the six packages to npm as a prerelease and point `latest` at
          them, so `npx laplus` works. Permanent — a version, once published,
          cannot be reused. Publishes no installer and cuts no release.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# Incremental compilation is a bet that the next build shares state with this
# one, which on a runner that is destroyed afterwards is a bet that never pays.
# What it does instead is fill `target/` with per-crate fragments that then have
# to be packed, uploaded and unpacked as part of the cache — so it costs twice,
# once to write and once to carry. Locally this tree had accumulated 15 GB of
# them against 1.6 GB of actual release output.
env:
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: Build, measure, publish
    # Forty minutes of Tauri that answers nothing about the npm half. A tag
    # always builds it; a dispatch has to ask, because the usual reason to
    # dispatch this workflow is to exercise the packages rather than the window.
    if: github.event_name != 'workflow_dispatch' || inputs.build_installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Defender scans every `.rlib`, `.pdb` and object file rustc emits, and a
      # Tauri build emits tens of thousands of them — so on Windows the antivirus
      # is a compiler tax rather than a background service. Excluding the two
      # directories cargo writes to is the single largest Windows-specific win
      # available here, and it costs nothing: the runner is disposable and sees
      # only this repository's own code.
      #
      # `continue-on-error` because a cache is an optimisation and so is this. If
      # a future image locks Defender policy down, the release should get slower,
      # not fail.
      - name: Exclude the build directories from Defender
        continue-on-error: true
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\server\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The tag is checked against the file rather than written into it.
      # Upstream aligns its package versions to whatever version the release
      # names, which suits a repository where the tag is the decision; here the
      # decision is `tauri.conf.json`, because that is the number the installer
      # and the executable's version resource carry. Rewriting it in CI would
      # leave the tree and the published artifact permanently disagreeing.
      #
      # Note that this is *not* the version laplus reports in the window: that
      # one is the UI bundle's, deliberately, and `docs/adr/0011` says why. The
      # two numbers differ on purpose and neither is wrong.
      - name: Check the tag against the shell's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          configured=$(node -p "require('./server/crates/laplus-shell/tauri.conf.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [[ "$configured" != "$tagged" ]]; then
            echo "Tag $GITHUB_REF_NAME says $tagged; tauri.conf.json says $configured." >&2
            echo "Bump the file and re-tag, rather than publishing an installer that" >&2
            echo "reports a version no commit carries." >&2
            exit 1
          fi
          echo "Releasing $configured."

      - name: Install
        run: pnpm install --frozen-lockfile

      # `laplus-shell`'s build script embeds this from a fixed path and panics
      # without it, so the bundle has to exist before any cargo command that
      # touches the shell — which `cargo xtask release` is.
      - name: Build web bundle
        run: pnpm build:web

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `cache-on-failure` is what lets this job ever become fast. The cache key
      # includes the job id, so the release job cannot borrow `rust.yml`'s —
      # and it would not want to, because `rust.yml` builds `default-members`,
      # which excludes the shell and therefore never downloads the three hundred
      # crates Tauri brings. The release job's first run is cold by construction.
      #
      # By default the action saves nothing when the job fails, so a first run
      # that runs out of `timeout-minutes` leaves no cache behind and the retry
      # is cold as well — a job that can never finish learning. Saving on failure
      # breaks that: whatever compiled before the timeout is kept, and the next
      # attempt starts from it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cache-on-failure: true

      # A tag can point at any commit, and neither `ci.yml` nor `rust.yml` fires
      # on one — their triggers are pull requests and pushes to `main`. So the
      # suite runs here, or a release ships code no check has seen.
      #
      # The TypeScript suite is deliberately absent: its one known-red test is a
      # 15-second timeout under parallel load that passes alone, and gating every
      # release on a flake teaches everybody to re-run the job until it is green,
      # which is the same as not having the gate. `ci.yml` covers that half on
      # `main`.
      - name: Test
        working-directory: server
        run: cargo test --no-fail-fast

      # Not a workspace dependency and cannot be one, so it has to be installed —
      # but not *compiled*. `cargo install` has no notion of a prebuilt binary
      # and always builds from source, which for this CLI is minutes of a Windows
      # runner; Tauri's own documentation says plainly that in CI "you're better
      # off choosing another installation method".
      #
      # The earlier note here claimed `Swatinem/rust-cache` reduced this to once
      # per cache generation. True, and weaker than it sounds: that cache is
      # keyed on the hashes of `Cargo.lock`, `Cargo.toml`, the toolchain file and
      # `.cargo/config.toml`, so any dependency bump at all pays the full compile
      # again — and this job had never completed once, so the cache did not exist.
      #
      # `cargo-binstall` downloads the release binary the Tauri project already
      # publishes and drops it in `~/.cargo/bin` as `cargo-tauri`, which is the
      # same name from the same place `cargo install` would have used. So
      # `cargo tauri build` in `xtask` keeps working untouched, and a developer
      # following `CLAUDE.md` with `cargo install` gets an identical CLI.
      # Falls back to compiling if the download is unavailable, so this is a
      # speed-up that cannot become an outage: the worst case is the several
      # minutes the job spent before this change, not a failed release.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        shell: bash
        run: |
          cargo binstall --no-confirm 'tauri-cli@^2' \
            || cargo install tauri-cli --version "^2" --locked
          cargo tauri --version

      # A missing key is otherwise found halfway through a release build, as a
      # signing error from a tool nobody was thinking about. Ticket 74.
      - name: Check the signing key is present
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set on this repository." >&2
            echo "An installed laplus only accepts an update signed by the key whose" >&2
            echo "public half is in tauri.conf.json. Without it this build cannot" >&2
            echo "produce one, and publishing an unsigned release would strand every" >&2
            echo "existing install on the version it has." >&2
            exit 1
          fi

      # `--measure-install` installs the artifact, weighs what landed on disk and
      # uninstalls it. It is opt-in because it touches the machine, and a
      # disposable runner is the one machine where that costs nothing.
      #
      # What it proves is that the installer *runs* on a Windows that has never
      # seen laplus, and what it actually writes there — half of ticket 24's
      # clean-machine criterion. What it does not prove is that the application
      # launches, and it says nothing about the WebView2 bootstrapper: these
      # images ship the runtime already, so the absent-runtime path stays untested
      # and unticked.
      # `bundle.createUpdaterArtifacts` makes this build sign what it produces,
      # so the key has to be in the environment of the build itself rather than
      # of the publish. An empty password is not an oversight: the private key
      # is the secret, and a password would be a second one to keep beside it
      # with nothing extra to protect.
      - name: Build, measure, install and weigh
        working-directory: server
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo xtask release --measure-install

      - name: Find the installer
        id: artifact
        shell: bash
        run: |
          installer=$(ls server/target/release/bundle/nsis/*-setup.exe)
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "Built $installer"

      # The manifest an installed laplus reads. `plugins.updater.endpoints` in
      # `tauri.conf.json` points at this file on the *latest* release, so it has
      # to be attached to every release or an install checks a stale one.
      #
      # It is generated from the signature file rather than written by hand:
      # whatever the bundler signed is what the manifest must name, and the two
      # drifting apart is a download that fails its signature check on somebody
      # else's machine, which is the worst place to find out.
      - name: Write the update manifest
        id: manifest
        shell: bash
        run: |
          signature=$(ls server/target/release/bundle/nsis/*.sig 2>/dev/null | head -n 1)
          if [[ -z "$signature" ]]; then
            echo "No .sig beside the installer. bundle.createUpdaterArtifacts is off," >&2
            echo "or the signing key was not in the build's environment." >&2
            exit 1
          fi
          signed="${signature%.sig}"
          version=$(node -p "require('./server/crates/laplus-shell/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag="v${version}"
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$signed")"
          node -e '
            const fs = require("fs");
            const [signaturePath, version, url] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              notes: "See the release notes for " + version + ".",
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(signaturePath, "utf8").trim(),
                  url,
                },
              },
            }, null, 2) + "\n");
          ' "$signature" "$version" "$url"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          cat latest.json

      # Uploaded whether or not this publishes, so a dispatch leaves something
      # to download and the size report is readable without cutting a release.
      - name: Upload the installer and the size report
        uses: actions/upload-artifact@v4
        with:
          name: laplus-windows-installer
          path: |
            server/target/release/bundle/nsis/*
            latest.json
            server/docs/artifact-size.md
          if-no-files-found: error

      # The whole bundle directory rather than the installer by name: what the
      # updater downloads is whatever the bundler signed, and naming that by
      # hand is how the manifest ends up pointing at a file the release does not
      # carry.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            server/target/release/bundle/nsis/*
            latest.json
            server/docs/artifact-size.md
          fail_on_unmatched_files: true

  # The plain server, once per platform `apps/cli/src/platform.ts` names.
  #
  # Cheap next to the job above: `laplus-server` is not Tauri, so there is no
  # WebView2, no three hundred crates and no bundler — a cold build is minutes,
  # and `rust.yml` already proves two of these five compile on every push.
  #
  # `--target` even where it is the host's own, so the output lands at
  # `target/<triple>/release/` on every runner and the upload step has one path
  # to know rather than five.
  server:
    name: Server binary (${{ matrix.key }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      # Each platform's answer is worth having on its own — and a red matrix
      # here is a release that does not publish, rather than one that publishes
      # a set with a hole in it. `stage` refuses to assemble that set.
      fail-fast: false
      matrix:
        include:
          - key: win32 x64
            slug: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: laplus-server.exe
          # **musl, statically linked, and that is the whole point.** These were
          # `-gnu` for one release and the first person to run `npx laplus` on a
          # real server got four lines of `GLIBC_2.39 not found`: a binary built
          # on `ubuntu-latest` carries the glibc floor of whatever `ubuntu-latest`
          # happens to be that month, and the machines people run servers on are
          # deliberately older than that. The fix cannot be a newer floor — 22.04
          # is 2.35 and would have failed the same box — because any floor at all
          # makes `npx laplus` a question about somebody's distribution.
          #
          # A musl build links libc in and asks the host for nothing, so it runs
          # on Ubuntu 20.04, on RHEL 8, and on Alpine, which has no glibc to be
          # a version of. The cost is musl's allocator, which is slower than
          # glibc's under threaded load; this server spawns processes and talks
          # to SQLite rather than allocating in a hot loop, so that is a price
          # paid in a currency it does not spend.
          - key: linux x64
            slug: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: laplus-server
          - key: linux arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: laplus-server
          - key: darwin arm64
            slug: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: laplus-server
          # Cross-compiled from the Apple Silicon runner rather than built on an
          # Intel one. Xcode's clang targets both architectures, which is all
          # the bundled SQLite needs, and it costs a `rustup target add` instead
          # of a runner label that Apple's hardware transition keeps taking away.
          - key: darwin x64
            slug: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            binary: laplus-server

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # See the note in `rust.yml`. Defender scans every object file rustc
      # emits, and on Windows that is the largest tax this job pays.
      - name: Exclude the build directories from Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\server\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      # `musl-gcc`, which rustc links through and which the `cc` crate needs to
      # compile `rusqlite`'s bundled SQLite against musl rather than against the
      # host's glibc. Without it the target is installed and cannot be linked.
      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
          cache-on-failure: true

      # The target-specific spellings rather than `CC`, which would also be read
      # by build scripts compiling for the *host* — the two are the same machine
      # here and not the same libc.
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build -p laplus-server --release --target ${{ matrix.target }}

      # Proof rather than assumption, and it costs a line. A dynamically linked
      # binary here is the bug this whole target change exists to remove, and it
      # would otherwise be found by somebody else on their own server.
      - name: Check the Linux binaries are static
        if: contains(matrix.target, 'musl')
        run: |
          # Relative to `server/`, which this job's `defaults` already put us
          # in — unlike the upload step below, where the path is the action's
          # and therefore the workspace's.
          binary=target/${{ matrix.target }}/release/laplus-server
          described=$(file -b "$binary")
          echo "$described"
          # `file`, not `ldd`. A static-pie binary is reported by `ldd` as
          # "statically linked" and by a non-pie one as "not a dynamic
          # executable", so a check written against either sentence calls the
          # other a failure — which is how this step first rejected a binary
          # that was exactly what it was asking for.
          case "$described" in
            *static*) ;;
            *)
              echo "$binary is dynamically linked; musl was supposed to make it static." >&2
              exit 1
              ;;
          esac

      # Named for the platform key rather than the Rust triple, because what
      # reads it back is `artifactName` in `apps/cli/src/release.ts`, which
      # thinks in Node's platform names. The triple stops mattering here.
      #
      # **`slug`, not `key`.** The key has a space in it — it is
      # `${process.platform} ${process.arch}`, which is the pair npm's `os` and
      # `cpu` want — and an artifact called `server-darwin arm64` is not the
      # directory `artifactName` then goes looking for. GitHub expressions have
      # no `replace`, so the dashed form is carried in the matrix rather than
      # computed, and the first dispatch run found this the hard way.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.slug }}
          path: server/target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # `npx laplus`.
  #
  # **Six packages, and the order they go up in matters.** The five platform
  # packages are optional dependencies of the launcher, pinned to this exact
  # version — so a launcher published first is an `npm install laplus` that
  # resolves against versions the registry has not seen yet. Binaries, then
  # launcher.
  #
  # The `@laplus` scope has to exist on npm, and `NPM_TOKEN` has to be allowed
  # to publish to it *and* to the unscoped `laplus` — the launcher belongs to a
  # user account rather than to the org, so a token scoped to the org alone
  # publishes five packages and fails on the sixth. **Nothing before the first
  # tagged run proves that.** A dispatch does not contact the registry at all;
  # it packs instead, and the first real publish is the first thing that tests
  # the credential.
  npm:
    name: Publish the server to npm
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Provenance: npm records which workflow at which commit built the
      # tarball, and that record is the only thing standing between `npx laplus`
      # and taking a stranger's word for what is in it.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same check the installer job makes, repeated rather than shared: the
      # two publish to different places and neither should be able to ship a
      # version the other refused. `tauri.conf.json` is the number of record —
      # see the note on that step for why it is not the tag.
      #
      # **A dispatch gets a prerelease suffix.** `0.1.1-rc.7` sorts below the
      # `0.1.1` that version number is going to name later, so a dispatch can
      # never collide with the release it is rehearsing, and the eventual tag
      # supersedes everything dispatched before it without any bookkeeping.
      #
      # A published prerelease still answers `npx laplus`, because that resolves
      # the `latest` dist-tag and `latest` is a pointer rather than a judgement
      # about the version it points at.
      - name: Settle the version
        id: version
        shell: bash
        run: |
          configured=$(node -p "require('./server/crates/laplus-shell/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [[ "$configured" != "$tagged" ]]; then
              echo "Tag $GITHUB_REF_NAME says $tagged; tauri.conf.json says $configured." >&2
              exit 1
            fi
            version="$configured"
          else
            version="${configured}-rc.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version."

      - name: Download the server binaries
        uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: binaries

      # What the launcher serves at `/`. The staging step refuses to assemble a
      # package without it rather than publish an `npx laplus` that 404s.
      - name: Build web bundle
        run: pnpm build:web

      - name: Stage the packages
        run: >
          node apps/cli/src/release.ts
          --version ${{ steps.version.outputs.version }}
          --binaries binaries
          --out staged

      # After staging, never before: `vp pack` inlines `package.json`'s version
      # into the bundle that answers `laplus --version`, so a build that ran
      # first would report 0.0.0 from a tarball that says otherwise.
      #
      # **`vp` directly rather than `pnpm --filter laplus build`.** Staging has
      # just written five `optionalDependencies` into that manifest that are
      # deliberately not in the lockfile — `launcherManifest` argues why they
      # cannot be committed — and pnpm verifies the lockfile against every
      # manifest before it runs a script. So the step that exists to package
      # that manifest is the one pnpm refuses, with `ERR_PNPM_OUTDATED_LOCKFILE`
      # about a file it is correct about and that nothing is going to install
      # from. The bundler needs none of that: it is a binary in this package's
      # own `node_modules`, and `pnpm install` above already put it there.
      - name: Pack the launcher
        working-directory: apps/cli
        run: ./node_modules/.bin/vp pack

      # **`./` is not decoration.** `npm publish apps/cli` is `owner/repo`-shaped,
      # so npm reads it as a GitHub shorthand and goes looking for a repository
      # called `apps/cli` over ssh instead of packing the directory. The leading
      # `./` is what makes it a path. It cost a dry run to find and would have
      # cost a release.
      # A tag always publishes; a dispatch publishes only when asked. Both point
      # `latest` at what they publish — the dispatch because the whole point of
      # asking is to make `npx laplus` work, and a prerelease sitting under a
      # dist-tag nobody types would not.
      - name: Publish the binaries, then the launcher
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in staged/@laplus/*; do
            npm publish "./$package" --access public --provenance --tag latest
          done
          npm publish ./apps/cli --access public --provenance --tag latest

      # What a dispatch produces instead of a publish: the six tarballs, exactly
      # as they would have gone up, left on the run to be downloaded and
      # installed from files.
      #
      # `npm pack` rather than `npm publish --dry-run`, which was what this did
      # first. A dry run prints the same file list and proves less than it
      # looks: it never contacts the registry at all — it succeeds against a
      # deliberately invalid token — so it says nothing about whether the
      # credential works or the scope exists. Only a real publish answers that.
      # Packing at least leaves something a person can install.
      - name: Pack what a tag would publish
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p tarballs
          for package in staged/@laplus/*; do
            npm pack "./$package" --pack-destination tarballs
          done
          npm pack ./apps/cli --pack-destination tarballs
          ls -la tarballs

      - name: Upload the tarballs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
