# The Rust server's test suite. Ticket 36, and ticket 05 of the headless-Linux
# effort for the second platform.
#
# **Two runners, because there are now two things being shipped.** Windows is
# what laplus *installs* on — the crate's `cfg(windows)` blocks, the ConPTY
# behind `portable-pty`, and the `panic = "abort"` reasoning in the workspace
# manifest, which is argued entirely from Windows not reaping orphaned children,
# are all code only that runner exercises. Linux is where `laplus-server` is now
# meant to *run* headless, driven from a phone or another machine, and nothing
# had ever compiled it there: every `#[cfg(not(windows))]` twin in the crate was
# written and never built. A platform nobody compiles is a platform that works
# by assertion.
name: Rust

on:
  pull_request:
    paths:
      - server/**
      - .github/workflows/rust.yml
  push:
    branches:
      - main
    paths:
      - server/**
      - .github/workflows/rust.yml

# A second push to a PR makes the first run pointless. Named per ref so `main`
# and each PR cancel only themselves.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# See `release.yml` for the argument. It applies harder here, because this
# workflow runs on every push and pull request touching `server/` rather than
# once per tag.
env:
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # Each platform's answer is worth having on its own. Cancelling Linux
      # because Windows went red — or the reverse — would hide exactly the
      # divergence this matrix exists to find, and turn one platform's failure
      # into no information about the other.
      fail-fast: false
      matrix:
        include:
          # The platform that ships, and the whole default set with it:
          # `laplus-server` and `xtask`.
          - os: windows-latest
            scope: ""
            test-args: -- --test-threads=1
          # The platform that runs headless. `-p laplus-server` rather than the
          # default set, because `xtask` exists to build and measure a Windows
          # installer — running its tests on Linux would be a second opinion
          # about string constants, not evidence about this platform.
          #
          # `ubuntu-latest` already carries a C toolchain, which `rusqlite`'s
          # `bundled` feature needs to compile SQLite. A bare Linux box does
          # not — see `server/docs/running-headless.md`.
          - os: ubuntu-latest
            scope: -p laplus-server
            test-args: ""

    # `server/` is the Cargo workspace root — `Cargo.toml`, `.cargo/config.toml`
    # and `target/` are there rather than at the repository root, so every cargo
    # command has to run from it.
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # See `release.yml`. The reasoning is the same and the runner is the same;
      # this is the workflow that pays it most often.
      #
      # `working-directory: server` is set for the job, so `${{ github.workspace }}`
      # rather than a relative path: this step is PowerShell talking to Defender,
      # not cargo, and it wants the absolute location.
      - name: Exclude the build directories from Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\server\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keyed per job by the action, so the two platforms do not share a cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # Separate from the test step so a platform that cannot *compile* says so
      # in one line, rather than in whichever test binary happened to be built
      # first. This is the step ticket 05 was really about.
      - name: Build
        run: cargo build ${{ matrix.scope }}

      # `--no-fail-fast` because cargo otherwise stops at the first failing
      # binary, so one failing lib test means no integration binary runs at all
      # — and the summary then reads like a suite that lost two hundred tests
      # rather than one that never started them. Ticket 29 is that lesson.
      #
      # `cargo test` with an empty scope covers `laplus-server` and `xtask`,
      # which is what `default-members` is for: `laplus-shell` needs a pnpm
      # build of `apps/web/dist` and is asked for by name or not at all. It is
      # Tauri, it would need WebKitGTK, and it is not built on either runner.
      #
      # Only Windows serializes tests. The socket binaries drive `.cmd` provider
      # doubles through anonymous pipes; under concurrent runner load a control
      # response can be accepted by the server while the double never resumes,
      # leaving an otherwise healthy test waiting for its terminal frame. The
      # release gate uses the same load-control lever. Linux has native shell
      # doubles and keeps the faster default parallelism.
      - name: Test
        run: cargo test ${{ matrix.scope }} --no-fail-fast ${{ matrix.test-args }}

      # Reports, does not gate. One pre-existing `result_large_err` in
      # `server.rs` would make `-D warnings` red on arrival, and a check that is
      # red for reasons unrelated to the change under review is one everybody
      # learns to ignore. Turn it into a gate once that is dealt with.
      #
      # `cargo fmt --check` is deliberately absent: this tree has never been
      # rustfmt-formatted and fails on all 29 files, so adding it here would be
      # a reformat of the whole server disguised as a CI change.
      - name: Clippy
        run: cargo clippy ${{ matrix.scope }} --all-targets
