# Rust server verification on the two supported runtime platforms.
name: Rust

on:
  pull_request:
    paths:
      - server/**
      - .github/workflows/rust.yml
  push:
    branches:
      - main
    paths:
      - server/**
      - .github/workflows/rust.yml

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Incremental artifacts cost more to save and restore than they return on an
  # ephemeral runner. The Cargo cache still retains reusable dependencies.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux's process doubles tolerate Cargo's normal parallel test
          # runner, so one job remains the cheapest and fastest arrangement.
          - name: ubuntu-latest
            os: ubuntu-latest
            command: cargo test -p laplus-server --no-fail-fast

          # Windows provider doubles become unreliable when tests inside one
          # binary run concurrently. Keep that proven constraint, but run
          # independent integration binaries in four CI jobs so one slow
          # binary no longer blocks every binary behind it.
          - name: windows unit and HTTP
            os: windows-latest
            command: >-
              cargo test -p laplus-server --lib --bins
              --test claude_text_generation --test cli --test http_boot
              --test http_cloudflare_account --test http_cloudflare_adoption
              --test http_cloudflare_cleanup --test http_cloudflare_connector
              --test http_cloudflare_creation --test http_cloudflare_install
              --test http_cors --test http_mcp --test http_orchestration
              --test http_pairing --test http_public_exposure --test http_ui
              --test network_public_exposure --test opencode_protocol
              --test opencode_text_generation --test process_shutdown
              --test protocol_golden --no-fail-fast -- --test-threads=1

          - name: windows Codex and core socket
            os: windows-latest
            command: >-
              cargo test -p laplus-server
              --test socket_activity_resets --test socket_archiving
              --test socket_assets --test socket_branches
              --test socket_codex_turn --test socket_concurrency
              --test socket_conformance --test socket_continuity
              --test socket_deleting --test socket_diffs --test socket_files
              --test socket_filesystem --no-fail-fast -- --test-threads=1

          - name: windows OpenCode socket
            os: windows-latest
            command: >-
              cargo test -p laplus-server
              --test socket_first_turn_titles --test socket_git
              --test socket_handshake --test socket_interrupt
              --test socket_lifecycle_fields --test socket_managing_worktrees
              --test socket_opencode_turn --no-fail-fast -- --test-threads=1

          - name: windows remaining socket and xtask
            os: windows-latest
            command: >-
              cargo test -p laplus-server
              --test socket_permissions --test socket_pinning
              --test socket_projects --test socket_provider
              --test socket_provider_maintenance --test socket_renaming
              --test socket_resilience --test socket_revert
              --test socket_session_stop --test socket_settings
              --test socket_settling --test socket_snoozing
              --test socket_streaming --test socket_terminal
              --test socket_terminal_lifecycle --test socket_thread_modes
              --test socket_tools --test socket_turn --test socket_usage
              --test socket_user_input --test socket_watch
              --test socket_worktrees --no-fail-fast -- --test-threads=1

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Exclude the build directories from Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\server\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cache-on-failure: true

      - name: Test
        run: ${{ matrix.command }}

      # xtask is Windows release machinery, but it has its own unit tests and
      # is deliberately a default workspace member. Keep it explicit because
      # the sharded server commands above select only laplus-server.
      - name: Test xtask
        if: matrix.name == 'windows remaining socket and xtask'
        run: cargo test -p xtask --no-fail-fast -- --test-threads=1

      - name: Test documentation
        if: matrix.name == 'windows unit and HTTP'
        run: cargo test -p laplus-server --doc --no-fail-fast -- --test-threads=1

  # Clippy does not depend on test execution, so putting it after the suite made
  # every successful run wait another minute for no additional evidence.
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            scope: -p laplus-server
          # Preserve the old Windows default-member coverage, including xtask.
          - os: windows-latest
            scope: ""

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Exclude the build directories from Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\server\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Clippy
        run: cargo clippy ${{ matrix.scope }} --all-targets
