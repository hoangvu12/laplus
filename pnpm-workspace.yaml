packages:
  - apps/*
  - oxlint-plugin-t3code
  - packages/*

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  bufferutil: false
  esbuild: true
  msgpackr-extract: true
  # Not a dependency of anything here — it arrives under `vitest`, which arrives
  # under `vite-plus`. Undeclared, pnpm 11 does not silently skip its build the
  # way pnpm 10 did: it installs everything, prints ERR_PNPM_IGNORED_BUILDS and
  # exits 1, which reads like a broken lockfile and is actually a policy asking
  # to be answered. That is what reddened `ci.yml` and what stopped the first
  # tagged release before it reached a compiler.
  #
  # `false` rather than `true` because the script it wants to run writes the
  # service-worker shim a browser needs to intercept `fetch`, and nothing in this
  # repository mocks a browser: the suite is node, and the shell talks to its own
  # server over a socket.
  msw: false
  utf-8-validate: false
  workerd: false

# Every version below is carried verbatim from the tree this repository was
# lifted out of. The `effect` line in particular is load-bearing: the RPC client
# changed its request-id encoding between beta.78 and beta.102, and the server
# only decodes what beta.102 sends. Bump it deliberately, and check the window
# opens and talks to its server afterwards — the conformance suite cannot see a
# change that happens underneath the contract.
catalog:
  "@effect/atom-react": 4.0.0-beta.102
  "@effect/platform-node": 4.0.0-beta.102
  "@effect/tsgo": 0.13.2
  "@effect/vitest": 4.0.0-beta.102
  "@pierre/diffs": 1.3.0-beta.5
  "@types/node": 24.12.4
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  effect: 4.0.0-beta.102
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2
  yaml: ^2.9.0

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-beta.102"
  - "@effect/platform-node@4.0.0-beta.102"
  - "@effect/vitest@4.0.0-beta.102"
  - effect@4.0.0-beta.102

overrides:
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  yaml: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.0-beta.102": patches/@effect__vitest@4.0.0-beta.102.patch
  "@legendapp/list@3.2.0": patches/@legendapp__list@3.2.0.patch
  "@pierre/diffs@1.3.0-beta.5": patches/@pierre%2Fdiffs@1.3.0-beta.5.patch
  effect@4.0.0-beta.102: patches/effect@4.0.0-beta.102.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
